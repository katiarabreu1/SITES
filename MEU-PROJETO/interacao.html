<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Mídia e Formulários</h1>
    <img src="https://placehold.co/400x100" alt="imagem de um gráfico de crescimento fictício">
    <h2>Arquivos de Mídia</h2>
    <audio controls>
        <source src="placeholder.mp3" type="audio/mpeg">
        seu navegador não suporta a tag de áudio
    </audio>
    <video width="320" controls>
        <source src="placeholder.mp4" type="video/mp4">
        Seu navegador não suporta a tag de vídeo
    </video>
    <h2>Relatório de Vendas(Tabela)</h2>
    <table>
        <caption>Produtos mais vendidos do mês</caption>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Unidades</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Câmera</td>
                <td>R$1.500</td>
                <td>32</td>
            </tr>
            <tr>
                <td>Lente</td>
                <td>R$750</td>
                <td>18</td>
            </tr>
        </tbody>
    </table>
    <h2>Formulário de Contato</h2>
    <form action="#" method="post">
        <fieldset>
            <legend>Informações Pessoais</legend>
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
             <div>
                <label for="data-nasc">Data de Nascimento:</label>
                <input type="date" id="data-nasc" name="Nascimento">
            </div>
             <div>
                <label for="msg">Mensagem:</label>
                <textarea id="msg" name="mensagem"></textarea>
            </div>
            <button type="submit">Enviar Formulário</button>
        </fieldset>
    </form>
</body>
</html>
